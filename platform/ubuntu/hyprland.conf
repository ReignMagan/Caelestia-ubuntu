# Independent Ubuntu session; does not source or rewrite ~/.config/hypr.
monitor = , preferred, auto, 1
$mod = SUPER
$terminal = caelestia-terminal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = ~/.local/share/caelestia-ubuntu/bin/start-shell
exec-once = ~/.local/share/caelestia-ubuntu/bin/start-terminal-server
exec-once = /usr/lib/policykit-1-gnome/polkit-gnome-authentication-agent-1
general {
 gaps_in = 5
 gaps_out = 10
 border_size = 2
 col.active_border = rgba(9ccbfbff)
 col.inactive_border = rgba(44474eff)
 layout = dwindle
}
decoration {
 rounding = 14
 shadow {
  enabled = false
 }
 blur {
  enabled = true
  size = 4
  passes = 1
 }
}
animations {
 enabled = true
 bezier = smooth, 0.2, 0.8, 0.2, 1
 animation = global, 1, 3, smooth
 animation = windows, 1, 3, smooth
 animation = windowsIn, 1, 3, smooth, popin 96%
 animation = windowsOut, 1, 2.5, smooth, popin 96%
 animation = fade, 1, 2, smooth
 # Caelestia animates its own panels; avoid a second compositor fade.
 animation = layers, 0
 animation = workspaces, 1, 3, smooth, slide
}
input {
 kb_layout = us
 follow_mouse = 1
 touchpad {
  natural_scroll = true
 }
}
dwindle {
 preserve_split = true
}
bind = $mod, Return, exec, $terminal
bind = $mod, T, exec, $terminal
bind = $mod, W, killactive,
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, V, togglefloating,
bind = $mod, Space, global, caelestia:launcher
bind = $mod, D, global, caelestia:dashboard
bind = $mod, N, global, caelestia:sidebar
bind = $mod, L, global, caelestia:lock
bind = $mod SHIFT, E, global, caelestia:session
bind = $mod CTRL, comma, global, caelestia:nexus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, global, caelestia:mediaToggle
bindl = , XF86AudioNext, global, caelestia:mediaNext
bindl = , XF86AudioPrev, global, caelestia:mediaPrev
